services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: runtime
        format: raw
    depends_on:
      db:
        condition: service_healthy
    networks:
      edge:
        aliases:
          - commentloom-app
      internal: {}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - path: runtime
        format: raw
    volumes:
      - commentloom_mysql:/var/lib/mysql
    networks:
      internal:
        aliases:
          - commentloom-db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-reverse_proxy}
  internal:
    internal: true
volumes:
  commentloom_mysql:
